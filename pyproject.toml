[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscoal"
version = "0.1.0"
description = "SCOAL and MSCOAL implementations for simultaneous co-clustering and learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "pyscoal contributors" },
]
license = { text = "MIT" }
keywords = ["co-clustering", "machine-learning", "sparse-matrix", "scikit-learn"]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.10",
  "scikit-learn>=1.5",
  "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
